version: "3.9"

# =============================================================================
# ONIGIRI POS — Docker Compose
# Servicios: PHP-FPM (app), Nginx (web), MySQL 8 (db), Redis (cache/queue)
# =============================================================================

networks:
  onigiri_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

services:

  # ---------------------------------------------------------------------------
  # APP — PHP 8.2 FPM (Laravel)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: onigiri_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-onigiri_db}
      - DB_USERNAME=${DB_USERNAME:-onigiri_user}
      - DB_PASSWORD=${DB_PASSWORD:-onigiri_secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - onigiri_network

  # ---------------------------------------------------------------------------
  # WEB — Nginx (proxy inverso → PHP-FPM)
  # ---------------------------------------------------------------------------
  web:
    image: nginx:1.25-alpine
    container_name: onigiri_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - onigiri_network

  # ---------------------------------------------------------------------------
  # DB — MySQL 8
  # ---------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: onigiri_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-onigiri_db}
      MYSQL_USER: ${DB_USERNAME:-onigiri_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-onigiri_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    ports:
      - "${DB_PORT_HOST:-3307}:3306"        # Puerto 3307 en host para evitar conflictos locales
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - onigiri_network

  # ---------------------------------------------------------------------------
  # REDIS — Cache / Queue / Sessions
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: onigiri_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT_HOST:-6380}:6379"        # Puerto 6380 en host para evitar conflictos locales
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - onigiri_network

  # ---------------------------------------------------------------------------
  # QUEUE WORKER — Laravel Jobs (procesamiento asíncrono, ej: PDF de facturas)
  # ---------------------------------------------------------------------------
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: onigiri_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-onigiri_db}
      - DB_USERNAME=${DB_USERNAME:-onigiri_user}
      - DB_PASSWORD=${DB_PASSWORD:-onigiri_secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - onigiri_network
