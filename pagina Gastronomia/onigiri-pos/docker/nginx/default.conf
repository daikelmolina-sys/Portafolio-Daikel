server {
    listen 80;
    server_name localhost;

    # Directorio raíz público de Laravel
    root /var/www/html/public;
    index index.php index.html;

    # Charset
    charset utf-8;

    # ---------------------------------------------------------------------------
    # Logs
    # ---------------------------------------------------------------------------
    access_log /var/log/nginx/onigiri_access.log;
    error_log  /var/log/nginx/onigiri_error.log;

    # ---------------------------------------------------------------------------
    # Seguridad básica
    # ---------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # ---------------------------------------------------------------------------
    # Enrutamiento Laravel — todo a index.php
    # ---------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ---------------------------------------------------------------------------
    # PHP-FPM — pasar .php al contenedor app
    # ---------------------------------------------------------------------------
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # ---------------------------------------------------------------------------
    # Bloquear acceso a archivos ocultos (.env, .git, etc.)
    # ---------------------------------------------------------------------------
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # ---------------------------------------------------------------------------
    # Assets estáticos con caché agresiva
    # ---------------------------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        log_not_found off;
    }

    # ---------------------------------------------------------------------------
    # Límites de subida (debe coincidir con php.ini)
    # ---------------------------------------------------------------------------
    client_max_body_size 25M;
}
